<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Animationen – kreativ-anders</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; padding: 1rem; max-width: 60rem; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1rem; }
    figure { margin: 0; text-align: center; }
    img { width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>Animationen</h1>
  <p>Selbstständige SVGs (CSS im SVG, 5-Sekunden-Loop, Standbild bei „Bewegung reduzieren“). Einbinden per <code>&lt;img&gt;</code>.</p>
  <main>
    <figure><img src="lean.svg" width="400" height="400" alt="Schlank"><figcaption>lean.svg</figcaption></figure>
    <figure><img src="transparent.svg" width="400" height="400" alt="Offen"><figcaption>transparent.svg</figcaption></figure>
    <figure><img src="success.svg" width="400" height="400" alt="Schnell"><figcaption>success.svg</figcaption></figure>
  </main>
</body>
</html>
